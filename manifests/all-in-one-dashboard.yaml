# Полный манифест для дашборда Cozystack: один файл, одно применение.
# Создаёт сразу: managed PostgreSQL, диск ВМ и саму ВМ с приложением.
# Терминал не нужен, всё создаётся из дашборда.
#
# Код приложения ВМ берёт сама: cloud-init клонирует этот публичный репозиторий.
#
# Вход в ВМ: консоль дашборда (VNC) или SSH, пользователь "ubuntu",
# пароль "cozystack" (лабораторный, поменяйте для реального).
#
# Пароль БД в app.env оставлен заглушкой. После входа в ВМ впишите реальный
# пароль пользователя appuser (дашборд -> Secrets -> postgres-demo-credentials
# -> ключ "appuser") в /etc/app.env и выполните: sudo systemctl restart app
---
apiVersion: apps.cozystack.io/v1alpha1
kind: Postgres
metadata:
  name: demo
spec:
  replicas: 2
  resourcesPreset: s1.small
  size: 5Gi
  users:
    appuser: {}
  databases:
    appdb:
      roles:
        admin:
          - appuser
---
apiVersion: apps.cozystack.io/v1alpha1
kind: VMDisk
metadata:
  name: app-disk
spec:
  storage: 5Gi
  storageClass: replicated
  optical: false
  source:
    http:
      url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
---
apiVersion: apps.cozystack.io/v1alpha1
kind: VMInstance
metadata:
  name: app
spec:
  instanceType: u1.small
  instanceProfile: ubuntu
  runStrategy: Always
  disks:
    - name: app-disk
  cloudInit: |
    #cloud-config
    ssh_pwauth: true
    password: cozystack
    chpasswd:
      expire: false
    package_update: true
    packages:
      - git
      - python3-venv
      - python3-pip
    write_files:
      - path: /etc/app.env
        content: |
          # Впишите пароль appuser из секрета postgres-demo-credentials,
          # затем: sudo systemctl restart app
          PGHOST=postgres-demo-rw
          PGPORT=5432
          PGUSER=appuser
          PGPASSWORD=REPLACE_ME_FROM_SECRET
          PGDATABASE=appdb
      - path: /etc/systemd/system/app.service
        content: |
          [Unit]
          Description=Demo app (VM to tenant Postgres)
          After=network-online.target
          Wants=network-online.target
          [Service]
          EnvironmentFile=/etc/app.env
          WorkingDirectory=/opt/lab/app
          ExecStart=/opt/app/venv/bin/python /opt/lab/app/app.py
          Restart=always
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
    runcmd:
      - git clone --depth 1 https://github.com/IvanHunters/cozystack-vm-postgres-lab.git /opt/lab
      - python3 -m venv /opt/app/venv
      - /opt/app/venv/bin/pip install --no-cache-dir -r /opt/lab/app/requirements.txt
      - systemctl daemon-reload
      - systemctl enable --now app.service
